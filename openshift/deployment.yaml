apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-logic
  labels:
    app: hello-logic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-logic
  template:
    metadata:
      labels:
        app: hello-logic
    spec:
      containers:
        - name: hello-logic
          # Przy budowaniu przez BuildConfig/S2I obraz wskazuje na wewnetrzny rejestr OpenShift.
          # Jesli budujesz lokalnie i wypychasz do innego rejestru - podmien ponizsza wartosc.
          image: image-registry.openshift-image-registry.svc:5000/tomek371240-dev/hello-logic:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hello-logic
  labels:
    app: hello-logic
spec:
  selector:
    app: hello-logic
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hello-logic
  labels:
    app: hello-logic
spec:
  to:
    kind: Service
    name: hello-logic
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
